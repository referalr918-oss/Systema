name: Build theme APK

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.10"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: systema-theme-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TAG="theme-$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          gh release create "$TAG" "$APK" \
            --title "Systema Theme $TAG" \
            --notes "APK теми іконок Systema. Встановіть на телефон і застосуйте в Nova Launcher → Налаштування → Вигляд → Тема іконок."
